<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>N7L STORE</title>
<style>
    body {
        background-color: #0b0c10;
        color: #c5c6c7;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        padding: 40px 20px;
        margin: 0;
        min-height: 100vh;
    }
    .container {
        max-width: 600px;
        margin: 0 auto;
        background-color: #151a21;
        padding: 25px;
        border-radius: 8px;
        border: 1px solid #1f2833;
        box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        text-align: right;
    }
    .logo-wrap {
        text-align: center;
        margin-bottom: 15px;
    }
    .logo-wrap img {
        width: 90px;
        height: 90px;
        border-radius: 16px;
        border: 1px solid #2d3748;
    }
    .title-bar {
        border-bottom: 1px solid #2d3748;
        padding-bottom: 15px;
        margin-bottom: 20px;
        text-align: center;
    }
    .title-bar h2 {
        margin: 0;
        color: #ffffff;
        font-size: 22px;
        letter-spacing: 1px;
    }
    .paste-box {
        background-color: #0d1117;
        border: 1px solid #21262d;
        border-radius: 6px;
        padding: 20px;
        font-family: monospace, 'Courier New', Courier;
        font-size: 14px;
        line-height: 1.8;
        white-space: pre-wrap;
        word-wrap: break-word;
        color: #c9d1d9;
    }
    .paste-box a, .paste-box a.link-card {
        display: block;
        color: #58a6ff;
        text-decoration: none;
        border-bottom: 1px dashed #21262d;
        padding: 6px 0;
        font-weight: bold;
    }
    .paste-box a:hover { color: #1f6feb; }
    .warning { color: #ff7b72; font-weight: bold; }
    .section-header {
        color: #aff5b4;
        font-size: 16px;
        margin-top: 20px;
        margin-bottom: 8px;
        font-weight: bold;
        display: block;
        border-bottom: 1px solid #21262d;
        padding-bottom: 5px;
    }
    .login-form { text-align: center; }
    input[type="text"] {
        width: 100%;
        padding: 12px;
        margin: 15px 0;
        border: 1px solid #30363d;
        background: #0d1117;
        color: #fff;
        border-radius: 6px;
        box-sizing: border-box;
        text-align: center;
        font-size: 16px;
    }
    button {
        width: 100%;
        padding: 12px;
        background-color: #238636;
        color: #ffffff;
        border: 1px solid #2ea44f;
        border-radius: 6px;
        font-weight: bold;
        font-size: 16px;
        cursor: pointer;
    }
    button:hover { background-color: #2ea44f; }
    .error { color: #f85149; text-align: center; margin-bottom: 15px; font-weight: bold; display:none; }
    .logout-btn {
        display: block;
        text-align: center;
        margin-top: 20px;
        color: #f85149;
        text-decoration: none;
        font-size: 13px;
        font-weight: bold;
        cursor: pointer;
    }
    #searchFab {
        position: fixed;
        top: 20px;
        left: 20px;
        width: 38px;
        height: 38px;
        border-radius: 50%;
        background-color: transparent;
        border: none;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        z-index: 1000;
    }
    #searchFab svg {
        width: 20px;
        height: 20px;
        stroke: #ffffff;
        filter: drop-shadow(0 2px 4px rgba(0,0,0,0.8));
    }
    #searchOverlay {
        position: fixed;
        top: 65px;
        left: 20px;
        right: 20px;
        max-width: 550px;
        margin: 0 auto;
        background-color: #151a21;
        border: 1px solid #30363d;
        border-radius: 8px;
        padding: 12px;
        display: none;
        z-index: 1000;
        box-shadow: 0 4px 15px rgba(0,0,0,0.6);
        max-height: 75vh;
        overflow-y: auto;
    }
    #searchOverlay.active { display: block; }
    #searchOverlay input {
        width: 100%;
        padding: 10px;
        border: 1px solid #30363d;
        background: #0d1117;
        color: #fff;
        border-radius: 6px;
        box-sizing: border-box;
        text-align: right;
        font-size: 14px;
    }
    #searchResults {
        margin-top: 10px;
    }
    #searchResults a.link-card {
        display: block;
        color: #58a6ff;
        text-decoration: none;
        border-bottom: 1px dashed #21262d;
        padding: 8px 0;
        font-weight: bold;
        font-size: 14px;
    }
    #searchResults .no-result {
        color: #8b949e;
        font-size: 13px;
        text-align: center;
        padding: 10px 0;
    }
</style>
</head>
<body>
<div class="container">
    <div class="logo-wrap">
        <img src="/IMG_3434.jpeg" alt="N7L Store Logo">
    </div>
    <div class="title-bar">
        <h2>N7L STORE</h2>
    </div>

    <p id="errorMsg" class="error"></p>

    <div id="loginForm" class="login-form">
        <p style="font-size:14px; color:#8b949e;">أدخل آيدي التليجرام الخاص بك للدخول</p>
        <input type="text" id="userIdInput" placeholder="مثال: 0000000000" autocomplete="off">
        <button onclick="checkAccess()">دخول</button>
    </div>

    <div id="otpForm" class="login-form" style="display:none;">
        <p style="font-size:14px; color:#8b949e;">تم إرسال كود التحقق لك عبر البوت، اكتبه هنا</p>
        <input type="text" id="otpInput" placeholder="اكتب الكود المكون من 6 أرقام" autocomplete="off">
        <button onclick="confirmOtp()">تأكيد</button>
    </div>

    <div id="content" style="display:none;">
        <div id="searchFab" onclick="toggleSearch()">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="11" cy="11" r="8"></circle>
                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
        </div>
        <div id="searchOverlay">
            <input type="text" id="searchInput" placeholder="ابحث عن سيارة أو ماب..." oninput="filterLinks()">
            <div id="searchResults"></div>
        </div>
        <div id="protectedContent" class="paste-box"></div>
        <a class="logout-btn" onclick="logout()">[ خروج ]</a>
    </div>
</div>

<script>
let currentUserId = "";

function showError(msg) {
    const el = document.getElementById('errorMsg');
    el.textContent = msg;
    el.style.display = 'block';
}
function hideError() {
    document.getElementById('errorMsg').style.display = 'none';
}

async function checkAccess() {
    hideError();
    const userId = document.getElementById('userIdInput').value.trim();
    if (!userId) {
        showError('اكتب آيديك أولاً.');
        return;
    }
    try {
        const res = await fetch('/api/verify', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ userId })
        });
        const data = await res.json();
        if (data.ok && data.needOtp) {
            currentUserId = userId;
            document.getElementById('loginForm').style.display = 'none';
            document.getElementById('otpForm').style.display = 'block';
        } else {
            showError(data.error || 'آيدي غير صحيح.');
        }
    } catch (e) {
        showError('حدث خطأ، حاول مرة أخرى.');
    }
}

async function confirmOtp() {
    hideError();
    const code = document.getElementById('otpInput').value.trim();
    if (!code) {
        showError('اكتب الكود المرسل لك.');
        return;
    }
    try {
        const res = await fetch('/api/confirm', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ userId: currentUserId, code })
        });
        const data = await res.json();
        if (data.ok) {
            document.getElementById('otpForm').style.display = 'none';
            document.getElementById('content').style.display = 'block';
            document.getElementById('protectedContent').innerHTML = data.html;
        } else {
            showError(data.error || 'الكود غير صحيح.');
        }
    } catch (e) {
        showError('حدث خطأ، حاول مرة أخرى.');
    }
}

function toggleSearch() {
    document.getElementById('searchOverlay').classList.toggle('active');
    if (document.getElementById('searchOverlay').classList.contains('active')) {
        document.getElementById('searchInput').focus();
    }
}

function filterLinks() {
    const query = document.getElementById('searchInput').value.trim().toLowerCase();
    const resultsBox = document.getElementById('searchResults');
    resultsBox.innerHTML = '';

    if (!query) {
        return;
    }

    const links = document.querySelectorAll('#protectedContent a.link-card');
    let count = 0;

    links.forEach(link => {
        const text = link.textContent.toLowerCase();
        if (text.includes(query)) {
            const clone = link.cloneNode(true);
            resultsBox.appendChild(clone);
            count++;
        }
    });

    if (count === 0) {
        const noResult = document.createElement('div');
        noResult.className = 'no-result';
        noResult.textContent = 'لا توجد نتائج مطابقة.';
        resultsBox.appendChild(noResult);
    }
}

function logout() {
    currentUserId = "";
    document.getElementById('content').style.display = 'none';
    document.getElementById('otpForm').style.display = 'none';
    document.getElementById('loginForm').style.display = 'block';
    document.getElementById('userIdInput').value = '';
    document.getElementById('otpInput').value = '';
}
</script>
</body>
</html>
